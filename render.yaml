# Render Blueprint for the Express API.
# In Render: New + → Blueprint → pick this repo. It reads this file.
services:
  - type: web
    name: ghafour-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true # Render generates a strong secret
      - key: JWT_EXPIRES
        value: 7d
      - key: BUSINESS_WHATSAPP
        value: "96179167963"
      - key: BUSINESS_NAME
        value: Ghafour Original 1919
      - key: ADMIN_NAME
        value: Ghafour Admin
      # --- set these yourself in the dashboard (secrets / per-deploy) ---
      - key: MONGO_URI
        sync: false # your MongoDB Atlas connection string
      - key: CLIENT_ORIGIN
        sync: false # your Netlify URL, e.g. https://ghafour.netlify.app
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
