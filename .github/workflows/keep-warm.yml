name: Keep API warm

# Render's free tier sleeps after ~15 min idle (cold start ~30-50s). Pinging the
# health endpoint keeps it responsive for customers. Free via GitHub Actions.
on:
  schedule:
    - cron: '*/12 * * * *' # every 12 minutes
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: curl -fsS --max-time 90 https://ghafour-api.onrender.com/api/health || true
