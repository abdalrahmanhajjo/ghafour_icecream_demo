name: Keep API warm

# Manual only. The old 12-minute schedule ran ~3,600 times a month, which is more
# than the 2,000 free Actions minutes a private repo gets, so GitHub blocked ALL
# workflows with a billing error. To keep the Render API awake, use a free external
# pinger instead (UptimeRobot or cron-job.org) pointed at:
#   https://ghafour-api.onrender.com/api/health
on:
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping health endpoint
        run: curl -fsS --retry 2 --max-time 90 https://ghafour-api.onrender.com/api/health || echo "API did not respond (it may be waking up)"
